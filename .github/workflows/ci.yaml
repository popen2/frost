name: 🔍 Build

# Validates the full release build (Rust lint + cargo test, then the signed +
# notarized Tauri matrix) on pull requests and on every push to main, so we
# can confirm everything works before drafting a release. On pushes to main,
# also updates the draft release notes that release.yaml will pick up when
# published.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: 🦀 Lint workspace
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout sources
        uses: actions/checkout@v6

      - name: ⚙️ Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: 💾 Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: 🎨 cargo fmt
        run: cargo fmt --all -- --check

      - name: 📎 cargo clippy
        # Only the library crates — src-tauri needs webkit2gtk and is
        # exercised end-to-end by the build job below.
        run: cargo clippy -p frost-core -p frost-aws --all-targets -- -D warnings

      - name: 🧪 cargo test
        run: cargo test -p frost-core -p frost-aws

  build:
    needs: rust-lint
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      publish: false

  draft:
    name: 📝 Update draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📝 Run release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml

name: 🔍 PR Build

# Validates the full release build (all platforms, including macOS signing and
# notarization) on pull requests, so we can confirm everything works before
# merging to main. It runs `electron-forge make` — which packages, signs and
# notarizes the app and produces the distributable zips — but never publishes a
# release or creates a tag.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEJS_VERSION: 22
  AWS_IAM_AUTHENTICATOR_VERSION: 0.7.16

jobs:
  lint:
    name: 🧹 Lint app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm

      - name: Install node modules
        run: |
          npm ci

      - name: Build app
        run: |
          npm run build

      - name: Run eslint
        run: |
          npm run lint

  build:
    name: 📦 Build (${{ matrix.os.name }} ${{ matrix.arch.name }})
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: darwin
            runs-on: macos-latest
          - name: linux
            runs-on: ubuntu-latest
        arch:
          - name: x86_64
            aws: amd64
            electron: x64
          - name: arm64
            aws: arm64
            electron: arm64
    runs-on: ${{ matrix.os.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm

      - name: Install node modules
        run: |
          npm ci

      - name: Build app
        run: |
          npm run build

      - name: Download aws-iam-authenticator
        run: |
          URL="https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v${AWS_IAM_AUTHENTICATOR_VERSION}/aws-iam-authenticator_${AWS_IAM_AUTHENTICATOR_VERSION}_${{ matrix.os.name }}_${{ matrix.arch.aws }}"
          TARGET="aws-iam-authenticator"
          curl -L "${URL}" -o "${TARGET}"
          chmod a+x "${TARGET}"

      - name: Add MacOS Certificates
        if: runner.os == 'macOS'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEY_CHAIN=build.keychain
          MACOS_CERT_P12_FILE=certificate.p12
          echo $MAC_CERTS | base64 --decode > $MACOS_CERT_P12_FILE
          security create-keychain -p actions $KEY_CHAIN
          security default-keychain -s $KEY_CHAIN
          security unlock-keychain -p actions $KEY_CHAIN
          security import $MACOS_CERT_P12_FILE -k $KEY_CHAIN -P $MAC_CERTS_PASSWORD -T /usr/bin/codesign;
          security set-key-partition-list -S apple-tool:,apple: -s -k actions $KEY_CHAIN
          rm -rf *.p12

          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_AUTHKEY_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Make app (sign + notarize)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./node_modules/.bin/electron-forge make --arch ${{ matrix.arch.electron }}

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: frost-${{ matrix.os.name }}-${{ matrix.arch.name }}
          path: out/make/**/*
          if-no-files-found: error

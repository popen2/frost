name: 🔍 Build

# Validates the full release build (all platforms, including macOS signing and
# notarization) on pull requests and on every push to main, so we can confirm
# everything works before drafting a release. Lints, then delegates the matrix
# build to build.yaml in "make" mode (signs, notarizes, zips, uploads
# artifacts; never tags or publishes). On pushes to main, also updates the
# draft release notes that release.yaml will pick up when published.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEJS_VERSION: 22

jobs:
  lint:
    name: 🧹 Lint app
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout sources
        uses: actions/checkout@v7

      - name: ⚙️ Install Node.js and NPM
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm

      - name: 📦 Install node modules
        run: |
          npm ci

      - name: 🔨 Build app
        run: |
          npm run build

      - name: 🧹 Run oxlint
        run: |
          npm run lint

      # The login window's credential overlay fails silently when it breaks -
      # no error, just a sign-in page that shows nothing while it waits for a
      # security key. This drives a real BrowserWindow through a real WebAuthn
      # wait and asserts the overlay reported it. It needs a display (xvfb) and
      # --no-sandbox, because the runner's Electron has no setuid sandbox
      # helper; it needs no security key.
      - name: 🔑 Check the login overlay
        run: |
          xvfb-run -a npm run check:overlay -- --no-sandbox

  build:
    needs: lint
    uses: ./.github/workflows/build.yaml
    # Read-only for pull request validation. The publish path declares its own
    # contents: write in release.yaml.
    permissions:
      contents: read
    secrets: inherit
    with:
      publish: false
      # Pull request jobs run `npm ci` and `npm run build` from the pull
      # request, so the Developer ID must not be in the keychain while they do.
      # Pushes to main are the same code that is about to be released, so those
      # still validate the full signed and notarized build.
      sign: ${{ github.event_name != 'pull_request' }}

  draft:
    name: 📝 Update draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📝 Run release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml

name: 📝 Draft Release Notes

# Maintains a single draft release on GitHub. Each push to main recomputes the
# draft (version + changelog). Pull request events drive the autolabeler so
# merged PRs get categorized correctly. Publishing the draft from the GitHub
# UI is what kicks off release.yaml.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: 📝 Update draft release
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Run release-drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          # On PR events we only want the autolabeler to run. Without this,
          # the releaser tries to update the draft with target_commitish set
          # to refs/pull/N/merge (not a real branch) and GitHub rejects it.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build

# Reusable build matrix shared by ci.yaml (PR validation) and release.yaml
# (release publish). Callers should pass `secrets: inherit` so this workflow
# can read MAC_CERTS, APPLE_API_*, and GITHUB_TOKEN without re-declaring them.
#
# Anything longer than a one-liner lives in .github/scripts/, invoked as `bash
# .github/scripts/<name>.sh` with its inputs passed through `env:`. Explicitly
# through `bash` so it does not depend on the executable bit surviving checkout
# on the Windows runner.

on:
  workflow_call:
    inputs:
      publish:
        description: >-
          If true, upload the distributables to the `v<version>` draft release
          (release.yaml publishes it once every job has). If false, upload them
          as workflow artifacts instead. Either way the build itself is the
          same `electron-forge make`.
        type: boolean
        default: false
      sign:
        description: >-
          If true, import the Developer ID into the runner keychain and let
          Forge sign and notarize. Callers set this false for pull request
          validation, which runs code from the pull request in the same job -
          see the "Add MacOS Certificates" step.
        type: boolean
        default: true
      version:
        description: >-
          If set, run `npm version --no-git-tag-version <version>` before
          building. Used by the release pipeline to stamp the auto-bumped tag.
        type: string
        default: ""

env:
  NODEJS_VERSION: 22
  AWS_IAM_AUTHENTICATOR_VERSION: 0.7.18

jobs:
  build:
    name: 📦 Build (${{ matrix.os.name }} ${{ matrix.arch.name }})
    strategy:
      fail-fast: false
      # Spelled out as `include` entries rather than an os × arch product,
      # because `arch.aws` is not a pure function of `arch` on Windows (see
      # below) and `exclude` does not match reliably against object-valued
      # matrix dimensions anyway.
      #
      # In `os`: `name` is the Electron platform (and what artifacts are named
      # after), `aws` is how the aws-iam-authenticator release spells the same
      # OS, and `exe` is the suffix carried by that asset and ours. In `arch`:
      # `electron` is the package we build, `aws` is the authenticator build
      # bundled into it — normally the same architecture.
      #
      # Windows/arm64 is the exception: aws-iam-authenticator publishes no
      # windows_arm64 build, so it takes the amd64 one. That costs nothing
      # real — the authenticator is a short-lived helper process kubectl
      # invokes, and Windows on ARM emulates x64 processes transparently —
      # while the app itself, which is where the CPU and battery actually go,
      # stays native.
      #
      # `authenticator_sha256` pins the exact bytes of the aws-iam-authenticator
      # asset for that row. GitHub release assets are mutable, and this binary is
      # bundled into a signed, notarized app and written into every user's
      # kubeconfig as the exec credential plugin - so kubectl runs it with their
      # AWS profile in the environment. A tag alone is not a strong enough pin.
      #
      # To refresh after bumping AWS_IAM_AUTHENTICATOR_VERSION:
      #
      #   V=0.7.18
      #   for t in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64.exe; do
      #     curl -fsSL "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v${V}/aws-iam-authenticator_${V}_${t}" \
      #       | shasum -a 256 | sed "s/-/${t}/"
      #   done
      #
      # win32/arm64 shares the windows_amd64 asset, so it shares its checksum.
      matrix:
        include:
          - os: { name: darwin, runs-on: macos-latest, aws: darwin, exe: "" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
            authenticator_sha256: ccc6756f9d41008e1a643f72e542097952c6f88457425a7b8a2f4500f79bf657
          - os: { name: darwin, runs-on: macos-latest, aws: darwin, exe: "" }
            arch: { name: arm64, aws: arm64, electron: arm64 }
            authenticator_sha256: 3704767c72ab56676ea1e398aa90ea42a53b0a9bd215a0babfae8e86bb21cf95
          - os: { name: linux, runs-on: ubuntu-latest, aws: linux, exe: "" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
            authenticator_sha256: fbebd5350dd1a5f377097fd1b2e1ca8c5a5e7ecb35cc44ddc694b775d498d7a5
          - os: { name: linux, runs-on: ubuntu-latest, aws: linux, exe: "" }
            arch: { name: arm64, aws: arm64, electron: arm64 }
            authenticator_sha256: 9d77c45e3a7a791ec3eb09a4913f9fff3be6e1d86d6af698ea104e4bbb7c933c
          - os: { name: win32, runs-on: windows-latest, aws: windows, exe: ".exe" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
            authenticator_sha256: 51fe83610dce3fd6efe6f97df91c93ce8f1b9fbb4eab48a541fc2a4016a2b24b
          - os: { name: win32, runs-on: windows-latest, aws: windows, exe: ".exe" }
            arch: { name: arm64, aws: amd64, electron: arm64 }
            authenticator_sha256: 51fe83610dce3fd6efe6f97df91c93ce8f1b9fbb4eab48a541fc2a4016a2b24b
    runs-on: ${{ matrix.os.runs-on }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: ⚙️ Install Node.js and NPM
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm

      - name: 📦 Install node modules
        run: |
          npm ci

      - name: 🔖 Set version
        if: ${{ inputs.version != '' }}
        run: |
          npm version --no-git-tag-version ${{ inputs.version }}

      - name: 🔨 Build app
        run: |
          npm run build

      - name: ⬇️ Download aws-iam-authenticator
        shell: bash
        env:
          OS_AWS: ${{ matrix.os.aws }}
          ARCH_AWS: ${{ matrix.arch.aws }}
          EXE: ${{ matrix.os.exe }}
          EXPECTED: ${{ matrix.authenticator_sha256 }}
        run: bash .github/scripts/download-authenticator.sh

      # Deliberately after `npm ci` and `npm run build` in the file, but gated
      # so it never runs in the same job as pull request code. A postinstall
      # script from a compromised dependency would otherwise be running
      # alongside the Developer ID certificate and the notarization key.
      - name: 🔐 Add MacOS Certificates
        if: runner.os == 'macOS' && inputs.sign
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_AUTHKEY_BASE64: ${{ secrets.APPLE_API_AUTHKEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash .github/scripts/add-macos-certificates.sh

      # npx rather than ./node_modules/.bin/electron-forge: the latter is a
      # shell script with no extension, which PowerShell on the Windows runner
      # cannot execute.
      # FROST_SIGN is what forge.config.js keys osxSign/osxNotarize off. With it
      # unset the package is left unsigned rather than half-configured, because
      # @electron/osx-sign fails outright when asked to sign with an identity
      # that is not in the keychain.
      #
      # Releases build the same way; only the upload step below differs.
      - name: 🛠️ Make app (sign + notarize)
        env:
          FROST_SIGN: ${{ inputs.sign }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx --no-install electron-forge make --arch ${{ matrix.arch.electron }}

      # The GitHub CLI rather than `electron-forge publish`, which cannot work
      # here: @electron-forge/publisher-github hand-sets a `content-length` on
      # its Octokit upload, Node's fetch appends its own on top, and the undici
      # that `electron-forge publish` installs as the global dispatcher (via
      # @electron/get 5's initializeProxy) rejects the combined "<n>, <n>"
      # before the request leaves the machine. That took down every job of the
      # v0.3.0 release matrix, and all three pieces are upstream.
      - name: 🚀 Upload to draft release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: bash .github/scripts/upload-release-assets.sh

      - name: 📤 Upload distributables
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: frost-${{ matrix.os.name }}-${{ matrix.arch.name }}
          path: out/make/**/*
          if-no-files-found: error

name: Build

# Reusable build matrix shared by ci.yaml (PR validation) and release.yaml
# (release publish). Callers should pass `secrets: inherit` so this workflow
# can read MAC_CERTS, APPLE_API_*, and GITHUB_TOKEN without re-declaring them.

on:
  workflow_call:
    inputs:
      publish:
        description: >-
          If true, run `electron-forge publish` (release). If false, run
          `electron-forge make` and upload the distributables as artifacts.
        type: boolean
        default: false
      version:
        description: >-
          If set, run `npm version --no-git-tag-version <version>` before
          building. Used by the release pipeline to stamp the auto-bumped tag.
        type: string
        default: ""

env:
  NODEJS_VERSION: 22
  AWS_IAM_AUTHENTICATOR_VERSION: 0.7.16

jobs:
  build:
    name: 📦 Build (${{ matrix.os.name }} ${{ matrix.arch.name }})
    strategy:
      fail-fast: false
      # Spelled out as `include` entries rather than an os × arch product,
      # because the product would contain win32/arm64 and `exclude` does not
      # match reliably against object-valued matrix dimensions.
      #
      # In `os`: `name` is the Electron platform (and what artifacts are named
      # after), `aws` is how the aws-iam-authenticator release spells the same
      # OS, and `exe` is the suffix carried by that asset and ours.
      #
      # There is no windows/arm64 row: aws-iam-authenticator publishes no
      # windows_arm64 build and Frost bundles it. Windows on ARM runs the x64
      # package under emulation, so nothing is lost.
      matrix:
        include:
          - os: { name: darwin, runs-on: macos-latest, aws: darwin, exe: "" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
          - os: { name: darwin, runs-on: macos-latest, aws: darwin, exe: "" }
            arch: { name: arm64, aws: arm64, electron: arm64 }
          - os: { name: linux, runs-on: ubuntu-latest, aws: linux, exe: "" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
          - os: { name: linux, runs-on: ubuntu-latest, aws: linux, exe: "" }
            arch: { name: arm64, aws: arm64, electron: arm64 }
          - os: { name: win32, runs-on: windows-latest, aws: windows, exe: ".exe" }
            arch: { name: x86_64, aws: amd64, electron: x64 }
    runs-on: ${{ matrix.os.runs-on }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: ⚙️ Install Node.js and NPM
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          cache: npm

      - name: 📦 Install node modules
        run: |
          npm ci

      - name: 🔖 Set version
        if: ${{ inputs.version != '' }}
        run: |
          npm version --no-git-tag-version ${{ inputs.version }}

      - name: 🔨 Build app
        run: |
          npm run build

      - name: ⬇️ Download aws-iam-authenticator
        # Git Bash on the Windows runner, so one script covers all three.
        shell: bash
        run: |
          URL="https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v${AWS_IAM_AUTHENTICATOR_VERSION}/aws-iam-authenticator_${AWS_IAM_AUTHENTICATOR_VERSION}_${{ matrix.os.aws }}_${{ matrix.arch.aws }}${{ matrix.os.exe }}"
          TARGET="aws-iam-authenticator${{ matrix.os.exe }}"
          # -f so a missing asset fails here instead of packaging GitHub's 404
          # page as the binary.
          curl -fL "${URL}" -o "${TARGET}"
          chmod a+x "${TARGET}"

      - name: 🔐 Add MacOS Certificates
        if: runner.os == 'macOS'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEY_CHAIN=build.keychain
          MACOS_CERT_P12_FILE=certificate.p12
          echo $MAC_CERTS | base64 --decode > $MACOS_CERT_P12_FILE
          security create-keychain -p actions $KEY_CHAIN
          security default-keychain -s $KEY_CHAIN
          security unlock-keychain -p actions $KEY_CHAIN
          security import $MACOS_CERT_P12_FILE -k $KEY_CHAIN -P $MAC_CERTS_PASSWORD -T /usr/bin/codesign;
          security set-key-partition-list -S apple-tool:,apple: -s -k actions $KEY_CHAIN
          rm -rf *.p12

          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_AUTHKEY_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      # npx rather than ./node_modules/.bin/electron-forge: the latter is a
      # shell script with no extension, which PowerShell on the Windows runner
      # cannot execute.
      - name: 🛠️ Make app (sign + notarize)
        if: ${{ !inputs.publish }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx --no-install electron-forge make --arch ${{ matrix.arch.electron }}

      - name: 🚀 Publish app
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx --no-install electron-forge publish --arch ${{ matrix.arch.electron }}

      - name: 📤 Upload distributables
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: frost-${{ matrix.os.name }}-${{ matrix.arch.name }}
          path: out/make/**/*
          if-no-files-found: error

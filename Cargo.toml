[workspace]
resolver = "2"
members = ["frost-core", "frost-aws", "src-tauri"]

[workspace.package]
# Placeholder — CI stamps the real version from the release tag (see
# release.yaml + build.yaml). 0.0.0 is intentional so it's obvious if a
# build leaked through unstamped.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Zohar Zilberman <popen2@gmail.com>"]
repository = "https://github.com/popen2/frost"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
slug = "0.1"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
